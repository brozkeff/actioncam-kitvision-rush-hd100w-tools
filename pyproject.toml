[project]
name = "rush-hd100w"
version = "0.0.1"
description = "Experimental control and virtual webcam tools for the Kitvision Rush HD100W action camera"
readme = "README.md"
authors = [{ name = "Martin brozkeff Malec" }]
requires-python = ">=3.15"
license = "EUPL-1.2"
license-files = ["LICENSE"]
keywords = ["action-camera", "kitvision", "webcam", "v4l2", "mjpeg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Video :: Capture",
    "Topic :: System :: Hardware",
]
dependencies = []

[tool.ruff]
target-version = "py315"

[tool.ty.environment]
python-version = "3.15"

[dependency-groups]
dev = [
    "ruff>=0.17.4",
    "ty>=0.0.98",
]
